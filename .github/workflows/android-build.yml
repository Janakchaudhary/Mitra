name: Android build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    # These are empty on fork PRs, which is intentional. PRs compile/test with
    # the runner debug key; installable artifacts from main/dispatch use the
    # persistent Mitra key restored below.
    env:
      MITRA_KEYSTORE_PASSWORD: ${{ secrets.MITRA_KEYSTORE_PASSWORD }}
      MITRA_KEY_ALIAS: ${{ secrets.MITRA_KEY_ALIAS }}
      MITRA_KEY_PASSWORD: ${{ secrets.MITRA_KEY_PASSWORD }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"

          PACKAGES=()
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            PACKAGES+=("platforms;android-35")
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            PACKAGES+=("build-tools;35.0.0")
          fi

          if [ ${#PACKAGES[@]} -gt 0 ]; then
            "$SDKMANAGER" "${PACKAGES[@]}"
          fi

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Restore persistent signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          MITRA_KEYSTORE_BASE64: ${{ secrets.MITRA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${MITRA_KEYSTORE_BASE64:-}" ] || \
             [ -z "${MITRA_KEYSTORE_PASSWORD:-}" ] || \
             [ -z "${MITRA_KEY_ALIAS:-}" ] || \
             [ -z "${MITRA_KEY_PASSWORD:-}" ]; then
            echo "::error::Persistent Mitra signing secrets are missing. Run scripts/setup-github-signing.sh once from a trusted Codespace, then rerun this workflow."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/mitra-signing.jks"
          printf '%s' "$MITRA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "MITRA_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Lint
        run: gradle lintDebug

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify signing certificate
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$APKSIGNER" verify --print-certs "$APK"

      # Only artifacts built with the persistent key should be downloaded for
      # phone installation. PR APKs intentionally use an ephemeral debug key.
      - name: Upload update-safe APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: mitra-update-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
