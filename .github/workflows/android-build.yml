name: Android build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pin the runner image so the Android SDK baseline is predictable.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu 24.04 runner already includes Android command-line tools,
      # ANDROID_HOME, Android 35, and Build Tools 35.0.0. Install only if a
      # future runner image does not contain the versions this project needs.
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"

          PACKAGES=()
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            PACKAGES+=("platforms;android-35")
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            PACKAGES+=("build-tools;35.0.0")
          fi

          if [ ${#PACKAGES[@]} -gt 0 ]; then
            "$SDKMANAGER" "${PACKAGES[@]}"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Lint
        run: gradle lintDebug

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mitra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
